[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidenceos"
version = "0.1.0a1"
description = "Auditable scientific evidence extraction with provenance, deterministic verification, and epistemic consistency checks."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{name = "EvidenceOS"}]
keywords = ["evidence-based medicine", "systematic review", "research", "scientific literature"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13"
]
dependencies = [
  "pydantic>=2.8,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "typer>=0.12,<1",
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
  "jsonschema>=4.23,<5",
  "pypdf>=5,<7",
  "python-multipart>=0.0.9,<1"
]

[project.optional-dependencies]
llm = ["openai>=1.40,<3"]
dev = ["pytest>=8,<10", "ruff>=0.6,<1", "mypy>=1.11,<2", "build>=1.2,<2"]

[project.scripts]
evidenceos = "evidenceos.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["evidenceos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
